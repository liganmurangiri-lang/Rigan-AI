
<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RIGAN AGI V2</title>

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #07111f;
    color: white;
}

header {
    background: #101f36;
    padding: 18px;
    text-align: center;
    border-bottom: 1px solid #28415e;
}

header h2 { margin: 0 0 8px; }

.status {
    color: #38e69a;
    font-size: 13px;
}

#messages {
    height: calc(100dvh - 165px);
    overflow-y: auto;
    padding: 15px;
}

.message {
    padding: 13px;
    margin: 12px 0;
    border-radius: 13px;
    max-width: 90%;
    line-height: 1.6;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
}

.user {
    background: #174e91;
    margin-left: auto;
}

.ai {
    background: #172b42;
    margin-right: auto;
}

form {
    position: fixed;
    bottom: 0;
    left: 0;
    width: 100%;
    display: flex;
    gap: 8px;
    padding: 12px;
    background: #101f36;
}

input {
    flex: 1;
    min-width: 0;
    padding: 14px;
    border-radius: 25px;
    border: 1px solid #45617e;
    background: #07111f;
    color: white;
    font-size: 16px;
}

button {
    background: #1684e8;
    color: white;
    border: none;
    border-radius: 25px;
    padding: 12px 20px;
    font-size: 15px;
}

button:disabled { opacity: .5; }

</style>
</head>

<body>

<header>
    <h2>RIGAN AGI V2</h2>
    <div class="status">● SYSTEM ONLINE</div>
    <small>Advanced Artificial Intelligence</small>
</header>

<div id="messages">
    <div class="message ai">
        Habari! Mimi ni RIGAN AGI V2.
        Niko tayari kukusaidia kuhusu sayansi,
        elimu, teknolojia na maswali mbalimbali.
        Niulize chochote!
    </div>
</div>

<form id="chatForm">
    <input
        id="message"
        placeholder="Andika swali lako..."
        autocomplete="off"
        required
    >
    <button id="send" type="submit">Tuma</button>
</form>

<script>
const form = document.getElementById("chatForm");
const input = document.getElementById("message");
const messages = document.getElementById("messages");
const send = document.getElementById("send");

function addMessage(text, type) {
    const div = document.createElement("div");
    div.className = "message " + type;
    div.textContent = text;
    messages.appendChild(div);
    messages.scrollTop = messages.scrollHeight;
    return div;
}

form.addEventListener("submit", async function(e) {
    e.preventDefault();

    const message = input.value.trim();
    if (!message || send.disabled) return;

    addMessage(message, "user");
    input.value = "";
    send.disabled = true;

    const waiting = addMessage("RIGAN AGI inafikiri...", "ai");

    try {
        const response = await fetch("/chat", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({message})
        });

        const data = await response.json();

        waiting.textContent = data.reply ||
            "Samahani, hakuna jibu lililopatikana.";

        if (!response.ok) {
            waiting.textContent += "\n\nAngalia mipangilio ya API.";
        }

    } catch (error) {
        waiting.textContent =
            "Imeshindikana kuwasiliana na server. Jaribu tena.";
    }

    send.disabled = false;
    input.focus();
    messages.scrollTop = messages.scrollHeight;
});
</script>

</body>
  </html>
